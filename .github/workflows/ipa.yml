name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Xcode info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build IPA
        run: bash build.sh

      - name: Summary
        run: |
          ls -l WristNote.ipa
          shasum -a 256 WristNote.ipa
          unzip -l WristNote.ipa | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: WristNote-ipa
          path: WristNote.ipa
          if-no-files-found: error

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<title>备忘录</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 首页 -->
<section class="view" id="view-home">
  <div class="hdr">
    <div class="hdr-top">
      <h1>备忘</h1>
      <div class="hdr-actions">
        <button class="iconbtn" id="btnSettings">⋯</button>
      </div>
    </div>
    <div class="searchbar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="2.4" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>
      </svg>
      <input id="search" type="search" placeholder="搜索备忘" autocomplete="off">
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
  <div class="floating">
    <button class="rbtn ghost" id="btnChat">💬</button>
    <button class="rbtn" id="btnNew">＋</button>
  </div>
</section>

<!-- 编辑器 -->
<section class="view" id="view-editor">
  <div class="ed-hdr">
    <button class="iconbtn" id="btnBack">‹</button>
    <input class="ed-title" id="edTitle" placeholder="标题" autocomplete="off">
    <span class="ed-status" id="edStatus">已保存</span>
    <button class="iconbtn" id="tDel">⋯</button>
  </div>
  <div class="ed-body" id="edBody" contenteditable="true" data-ph="写点什么…"></div>
  <div class="toolbar">
    <button class="tool" id="tBold">B</button>
    <button class="tool" id="tColor">A</button>
    <button class="tool" id="tHl">高</button>
    <button class="tool" id="tTodo">□</button>
    <button class="tool" id="tImg">图</button>
    <button class="tool" id="tRec">🎙</button>
  </div>
</section>

<!-- 设置 -->
<section class="view" id="view-settings">
  <div class="hdr">
    <div class="hdr-top">
      <button class="iconbtn" id="settingsBack">‹</button>
      <h1 style="font-size:19px">设置</h1>
      <span style="width:34px"></span>
    </div>
  </div>
  <div class="page" id="settingsPage"></div>
</section>

<!-- 回收站 -->
<section class="view" id="view-trash">
  <div class="hdr">
    <div class="hdr-top">
      <button class="iconbtn" id="trashBack">‹</button>
      <h1 style="font-size:19px">回收站</h1>
      <button class="iconbtn" id="trashClear">清空</button>
    </div>
  </div>
  <div class="page" id="trashPage"></div>
</section>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<span id="appVer" style="display:none">v1.0.0</span>

<script src="native.js"></script>
<script>
  window.__errs = [];
  window.onerror = function (m, s, l, c) {
    window.__errs.push(m + ' @' + l + ':' + c);
    var t = document.getElementById('toast');
    if (t) { t.textContent = 'JS 错误: ' + m; t.classList.add('on'); }
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    window.__errs.push('rejection: ' + ((e.reason && e.reason.message) || e.reason));
  });
</script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
